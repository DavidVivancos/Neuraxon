name: tests

# The repository has no CI today, so nothing protects the consensus guarantees
# the NXAnt tests assert. Those are exactly the kind that break silently:
# #3 removed a wall-clock read from the verify path, and review of #4 then
# caught a second divergence that only appeared under the "spawn" and
# "forkserver" process start methods.
#
# That second bug is why this matrix spans Python versions rather than pinning
# one: forkserver became the default start method on Linux in Python 3.14,
# so a test box on 3.13 and a user on 3.14 run genuinely different code paths.
# A single-version job would have stayed green through it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 and 3.14 differ in the default multiprocessing start method,
        # which is what surfaced the objective-not-reaching-workers bug.
        python: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        # requirements.txt is correct that the library itself needs no
        # dependencies; the test runner is the one exception.
        run: python -m pip install --upgrade pip pytest

      - name: Show the multiprocessing start method in use
        # Printed on purpose: when a parallel-verify test fails on one row of
        # the matrix and not another, this line is the first thing worth seeing.
        run: |
          python -c "import multiprocessing as mp, sys; \
            print('python', sys.version.split()[0]); \
            print('default start method:', mp.get_start_method()); \
            print('available:', mp.get_all_start_methods())"

      - name: Run the test suite
        # testpaths and norecursedirs come from pytest.ini.
        run: python -m pytest -v

  gene-roundtrip:
    # Not a pytest test -- a script that works at import time, depends on its
    # working directory, and reports by printing. Run it the way it is meant
    # to be run instead of forcing it into collection.
    name: gene round-trip script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run from its own directory
        working-directory: GameOfLife/NxonLive
        run: python tools/test_gene_roundtrip.py

  consensus-end-to-end:
    # The unit tests assert determinism in isolation; this asserts it for a
    # whole simulated network, which is the property that actually matters.
    # The tight --ant-budget is the configuration that used to diverge before
    # #3, so a regression here would be loud.
    name: multi-node agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Three nodes must agree on every tick
        working-directory: NXAnt
        run: |
          python NxonNode.py --nodes 3 --miners 5 --ticks 4 \
            --walk-steps 400 --ant-budget 0.02 --output-dir ci_out | tee ci.log
          grep -q "Ticks with full agreement: 4/4" ci.log \
            || { echo "::error::nodes disagreed - consensus determinism regressed"; exit 1; }
          grep -q "byte-identical across nodes: True" ci.log \
            || { echo "::error::system files differ between nodes"; exit 1; }
