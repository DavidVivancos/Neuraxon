# Make a bare `pytest` at the repository root work.
#
# Without this, collection aborts for the WHOLE repo on
# GameOfLife/NxonLive/tools/test_gene_roundtrip.py. That file is a standalone
# script, not a pytest test: it does its work at import time, expects
# GameOfLife/NxonLive as the working directory, and reports by printing rather
# than asserting. Collected from the root it cannot find `server` and errors
# out, taking every other test with it.
#
# It is still exercised in CI, run the way it is meant to be run -- as a script
# from its own directory. See .github/workflows/tests.yml.
#
# cuNxon is CUDA and needs an NVIDIA toolchain, so it is out of scope here too.

[pytest]
testpaths =
    tests
    NXAnt/tests

norecursedirs =
    GameOfLife
    cuNxon
    .git
    __pycache__

addopts = -q
